<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda Online</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Tienda Online</h1>
    </header>
    <section id="main_page">
      <div id="añadir">
        <button id="anadir-btn" onclick="mostrarCuestionario()">
          Añadir producto
        </button>
      </div>
      <form id="añadir_producto" onsubmit="enviarRespuestasProducto(event)">
        <div>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required />
        </div>
        <div>
          <label for="precio">Precio:</label>
          <input type="number" id="precio" name="precio" required />
        </div>
        <div>
          <label for="src">Cantidad:</label>
          <input type="number" id="cantidad" name="cantidad" required />
        </div>
        <div>
          <label for="src">Enlace:</label>
          <input type="url" id="enlace" name="enlace" required />
        </div>
        <div>
          <label for="categoria">Categoría:</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Ropa">Ropa</option>
            <option value="Hogar">Accesorios</option>
          </select>
        </div>
        <div>
          <label for="descripcion">Descripción:</label>
          <textarea id="descripcion" name="descripcion" required></textarea>
        </div>
        <button onclick="enviarRespuestasProducto(event)">Enviar</button>
        <button class="boton" onclick="ocultarCuestionario()">Cerrar</button>
      </form>
      <div id="añadir">
      <button id="anadir-btn" onclick="mostrarTiendas()">
        Añadir tienda
      </button>
    </div>
      <form id="añadir_tienda" onsubmit="enviarRespuestasTienda(event)">
        <div>
          <label for="lugar">Lugar:</label>
          <input type="text" id="lugar" name="lugar" required />
        </div>
        <div>
          <label for="coordenada x">Coordenada X:</label>
          <input type="number" id="precio" name="coordenada x" required />
        </div>
        <div>
          <label for="coordenada y">Coordenada Y:</label>
          <input type="number" id="cantidad" name="coordenada y" required />
        </div>
        <div>
          <label for="src">Enlace:</label>
          <input type="url" id="enlace_tienda" name="enlace" required />
        </div>

        <button onclick="enviarRespuestasTienda(event)">Enviar</button>
        <button class="boton" onclick="ocultarTiendas()">Cerrar</button>
      </form>

      <div id="products">
      </div>
    </section>
    <a id="cartLink" onclick="showCart()">
      <img src="./images/carrito.png" alt="Carrito de Compra" id="cartIcon" />
    </a>

    <div id="error-modal" class="modal">
      <div id="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <p id="error-message"></p>
      </div>
    </div>
    <script src="admin.js"></script>
  </body>
</html>
